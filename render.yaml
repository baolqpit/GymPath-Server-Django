services:
  - type: web
    name: gympath-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --no-input
    startCommand: gunicorn gympath.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true        # Render tự sinh secret key
      - key: ALLOWED_HOSTS
        value: gympath-api.onrender.com
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: gympath-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gympath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gympath-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: gympath-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gympath-db
          property: port

databases:
  - name: gympath-db
    databaseName: gymdb
    user: gym
